name: CI

on:
  push:
  pull_request:

jobs:
  build-abc-and-test:
    runs-on: ubuntu-latest
    # A hang guard, not a performance assertion: every ABC call is a
    # subprocess, and a wedged child would otherwise sit here until the
    # 6-hour default.
    timeout-minutes: 30
    steps:
      # v7/v6 rather than v4: v4 of these actions targets Node 20, which
      # the runners now force onto Node 24 with a deprecation warning and
      # will eventually stop carrying.
      - uses: actions/checkout@v7

      - name: Read pinned ABC commit
        id: abclock
        run: |
          commit=$(grep -E '^commit=' abc.lock | cut -d= -f2-)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Cache ABC build
        id: cache-abc
        uses: actions/cache@v6
        with:
          path: ~/opt/eda
          key: abc-${{ runner.os }}-${{ steps.abclock.outputs.commit }}

      - name: Build ABC (scripts/setup_abc.sh)
        run: ./scripts/setup_abc.sh

      - name: Resolve ABC binary
        id: resolve
        run: |
          bin=$(./scripts/find_abc.sh)
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          "$bin" -c "version; quit"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package + test deps
        run: pip install -e '.[test]'

      - name: Run tests
        run: pytest -q
